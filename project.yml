name: FenUITesting
options:
  bundleIdPrefix: com.zoharbabin
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.0-dev"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Fen:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  FenMacOSApp:
    type: application
    platform: macOS
    sources:
      - path: macOS
        excludes:
          - "AppIcon.iconset"
          - "DocumentIcon.iconset"
          - "Info-AppStore.plist"
          - "FenAppStore.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoharbabin.fen
        PRODUCT_NAME: Fen
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Fen.entitlements
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Fen
        product: FenCore
      - package: Sparkle
      - target: FenQuickLook
        embed: true

  # The Mac App Store build (issue #40, docs/APP-STORE.md). Same sources, but sandboxed, no Sparkle and
  # no Check for Updates command (the APPSTORE flag). Git is off at run time: see GitTool.locate().
  FenMacOSAppStore:
    type: application
    platform: macOS
    sources:
      - path: macOS
        excludes:
          - "AppIcon.iconset"
          - "DocumentIcon.iconset"
          - "*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoharbabin.fen
        PRODUCT_NAME: Fen
        INFOPLIST_FILE: macOS/Info-AppStore.plist
        CODE_SIGN_ENTITLEMENTS: macOS/FenAppStore.entitlements
        GENERATE_INFOPLIST_FILE: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CG9APRC4WT
    dependencies:
      - package: Fen
        product: FenCore
      - target: FenQuickLook
        embed: true

  FenQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: FenQuickLook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoharbabin.fen.quicklook
        PRODUCT_NAME: FenQuickLook
        INFOPLIST_FILE: FenQuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: FenQuickLook/FenQuickLook.entitlements
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
    dependencies:
      - package: Fen
        product: FenCore

  FeniOSApp:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoharbabin.fen-ios
        PRODUCT_NAME: Fen
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Fen.entitlements
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CG9APRC4WT
    dependencies:
      - package: Fen
        product: FenCore
      - target: FenShare
        embed: true

  # The share-sheet extension (issue #43). It compiles the two inbox files itself instead of
  # linking FenCore, so the extension stays small and has no resources, parsers or network code.
  FenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: FenShare
        excludes:
          - "*.entitlements"
      - path: Shared/Models/SharedTextInbox.swift
      - path: Shared/Models/SharedTextImport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoharbabin.fen-ios.share
        PRODUCT_NAME: FenShare
        INFOPLIST_FILE: FenShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: FenShare/FenShare.entitlements
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CG9APRC4WT
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true

  FenMacOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/FenUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoharbabin.fen.UITests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FenMacOSApp
        # Automatic signing otherwise sandboxes the test runner, which silently redirects
        # FileManager calls (Application Support, home-relative paths) into the runner's own
        # container instead of the real locations the unsandboxed app under test reads/writes --
        # breaking any test that plants or wipes real app state on disk.
        CODE_SIGN_ENTITLEMENTS: UITests/FenUITests/FenUITests.entitlements
    dependencies:
      - target: FenMacOSApp

  FeniOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/FeniOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoharbabin.fen-ios.UITests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FeniOSApp
    dependencies:
      - target: FeniOSApp

schemes:
  FenMacOSApp:
    build:
      targets:
        FenMacOSApp: all
        FenQuickLook: all
        FenMacOSUITests: [test]
    test:
      targets:
        - FenMacOSUITests

  FeniOSApp:
    build:
      targets:
        FeniOSApp: all
        FeniOSUITests: [test]
    test:
      targets:
        - FeniOSUITests
